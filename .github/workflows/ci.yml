name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # vet, tests and formatting on the three desktop/server OSes.
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -count=1 ./...

  wasm:
    # The browser build (GOOS=js GOARCH=wasm), and its smoke test over loopback HTTP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: GOOS=js GOARCH=wasm go build ./...
      - run: GOOS=js GOARCH=wasm go build -trimpath -ldflags='-s -w' -o /tmp/lm15-go.wasm ./cmd/lm15-wasm
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node cmd/lm15-wasm/smoke.mjs "$(go env GOROOT)/lib/wasm/wasm_exec.js" /tmp/lm15-go.wasm

  contract:
    # The shared harness sandboxes the shim with Linux's `unshare -rn`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check out pinned contract
        run: |
          PIN=$(tr -d '[:space:]' < CONTRACT_PIN)
          [[ "$PIN" =~ ^[0-9a-f]{40}$ ]] || { echo 'Invalid CONTRACT_PIN'; exit 1; }
          git clone --no-checkout https://github.com/lm15-dev/lm15-contract.git ../lm15-contract
          git -C ../lm15-contract checkout --detach "$PIN"
      - run: go build -o bin/lm15-vet ./cmd/lm15-vet
      - name: Contract harness (every direction, at the pin)
        run: python3 ../lm15-contract/harness/check.py --shim go --direction all
